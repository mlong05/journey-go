# =====================================================================================
#  Spring Profile: PROD — chạy trong Docker (self-hosted qua Cloudflare Tunnel).
#  Kích hoạt: SPRING_PROFILES_ACTIVE=prod
#
#  ⚠️ Mọi giá trị nhạy cảm ĐỀU phải đến từ biến môi trường (file `.env` ở thư mục gốc,
#     nạp vào container qua docker-compose.yml). KHÔNG có giá trị mặc định "thật" ở đây —
#     nếu thiếu biến ⇒ ứng dụng fail sớm (fail-fast) thay vì chạy với secret yếu.
# =====================================================================================

server:
  port: ${PORT:8088}
  # ── QUAN TRỌNG cho Cloudflare Tunnel ────────────────────────────────────────
  # Cloudflare/Tunnel gửi kèm header `X-Forwarded-Proto: https`, `X-Forwarded-For`.
  # `framework` ⇒ Spring dùng các header này để:
  #   • tạo redirect OAuth2 đúng scheme https (http:// ⇒ https://)
  #   • Cookie `Secure` được đặt đúng
  #   • `request.getRequestURL()` trả về URL public
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  # ── Datasource (Docker network) ─────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/journeygo_db}
    username: ${SPRING_DATASOURCE_USERNAME:journeygo}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Tối ưu cho 1 instance backend trên máy cá nhân.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: journeygo-pool

  # ── Redis (Docker network) ──────────────────────────────────────────────────
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  jpa:
    hibernate:
      # GIỮ NGUYÊN hành vi của hệ thống hiện tại (bảng cũ do Hibernate quản lý,
      # bảng nghiệp vụ mới do Flyway quản lý).
      ddl-auto: update
    properties:
      hibernate:
        # Prod: KHÔNG log SQL (rất nhiều log khi chạy lâu).
        format_sql: false
        show-sql: false

  # ── Flyway: tự migrate schema khi deploy phiên bản mới ─────────────────────
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    repair: false

  # ── Mail ────────────────────────────────────────────────────────────────────
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ── OAuth2 (Google) ─────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid
            # Dùng {baseUrl} để URL redirect bám theo scheme/host thực tế
            # (nhờ forward-headers-strategy=framework) ⇒ tự động là https://journeygo.id.vn
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  # ── Tài nguyên: giảm rủi ro OOM trên máy cá nhân ──────────────────────────
  lifecycle:
    timeout-per-shutdown-phase: 30s

# ── Actuator: chỉ mở endpoint cần cho healthcheck Docker ──────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true

app:
  # ── CORS: chỉ domain public (KHÔNG mở localhost ở production) ───────────────
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://journeygo.id.vn}

  # ── WebSocket/STOMP: chỉ domain public ─────────────────────────────────────
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:https://journeygo.id.vn}

  # ── OAuth2 redirect ────────────────────────────────────────────────────────
  oauth2:
    default-redirect-uri: ${OAUTH2_DEFAULT_REDIRECT_URI:https://journeygo.id.vn/oauth2/redirect}
    authorized-redirect-uris: ${OAUTH2_AUTHORIZED_REDIRECT_URIS:https://journeygo.id.vn/oauth2/redirect,journeygo://oauth2/redirect,journeygo://auth/callback}

  # ── Partner links ──────────────────────────────────────────────────────────
  partner:
    web-login-url: ${PARTNER_WEB_LOGIN_URL:https://journeygo.id.vn/login}
    activation-url: ${PARTNER_ACTIVATION_URL:https://journeygo.id.vn/activate}
    support-contact: ${PARTNER_SUPPORT_CONTACT:support@journeygo.com}

  # ── Mail ────────────────────────────────────────────────────────────────────
  mail:
    from-name: ${MAIL_FROM_NAME:JourneyGo Platform}
    otp-expiration-minutes: ${MAIL_OTP_EXPIRATION_MINUTES:10}

  # ── Journey: KHÔNG bỏ qua kiểm tra GPS ở production ───────────────────────
  journey:
    skip-location-check: ${JOURNEY_SKIP_LOCATION_CHECK:false}

  # ── Cloudinary / Goong / AI ────────────────────────────────────────────────
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  goong:
    api-key: ${GOONG_API_KEY:}

  # ── AI Virtual Guide (RAG) — Google Gemini ────────────────────────────────
  # ⚠️ KHỐI NÀY PHẢI CÓ Ở PROFILE PROD. Nếu thiếu, `GEMINI_API_KEY` truyền vào
  # container KHÔNG có chỗ nào để bind vào ⇒ `journeygo.ai.api-key` rỗng ⇒ AI trả
  # lỗi "Chưa cấu hình GEMINI_API_KEY" dù Admin đã đặt đúng biến trong .env.
  #
  #   (Spring thực ra vẫn merge từ application.yml, nhưng khai báo tường minh ở
  #    đây giúp file prod tự đủ (self-contained) và không phụ thuộc hành vi merge.)
  journeygo:
    ai:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
      chat-model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
      chunk-size: 400
      chunk-overlap: 50
      top-k: 4
      rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:20}
      max-question-length: ${AI_MAX_QUESTION_LENGTH:1000}

  # ── VNPay Sandbox ───────────────────────────────────────────────────────────
  vnpay:
    enabled: ${VNPAY_ENABLED:true}
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    version: ${VNPAY_VERSION:2.1.0}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    merchant-api-url: ${VNPAY_MERCHANT_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    ipn-url: ${VNPAY_IPN_URL}
    return-url: ${VNPAY_RETURN_URL}
    web-return-url: ${VNPAY_WEB_RETURN_URL}
    app-return-url: ${VNPAY_APP_RETURN_URL:journeygo://payment/return}
    app-redirect-enabled: ${VNPAY_APP_REDIRECT_ENABLED:false}
    app-scheme: ${VNPAY_APP_SCHEME:journeygo}
    ip-addr: ${VNPAY_IP_ADDR:127.0.0.1}
    timezone: ${VNPAY_TIMEZONE:Asia/Ho_Chi_Minh}
    expiry-minutes: ${VNPAY_EXPIRY_MINUTES:10}
    api-timeout-ms: ${VNPAY_API_TIMEOUT_MS:15000}
    verify-signature: ${VNPAY_VERIFY_SIGNATURE:true}
    locale: ${VNPAY_LOCALE:vn}
    order-type: ${VNPAY_ORDER_TYPE:other}
    bank-code: ${VNPAY_BANK_CODE:}
    bank-list-url: ${VNPAY_BANK_LIST_URL:https://sandbox.vnpayment.vn/qrpayauth/api/merchant/get_bank_list}
    qr-bank-type: ${VNPAY_QR_BANK_TYPE:1}
    domestic-card-bank-type: ${VNPAY_DOMESTIC_CARD_BANK_TYPE:2}
    international-card-bank-type: ${VNPAY_INTERNATIONAL_CARD_BANK_TYPE:3}

# ── Logging: prod = gọn, không log SQL, không log secret ──────────────────────
logging:
  level:
    root: ${LOGGING_LEVEL:INFO}
    com.journeygo: ${LOGGING_LEVEL:INFO}
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ── JWT: KHÔNG có giá trị mặc định ⇒ fail-fast nếu thiếu biến môi trường ──────
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

springdoc:
  # Prod: tắt Swagger UI để không lộ API schema công khai.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
