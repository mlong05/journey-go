# =====================================================================================
#  JourneyGo — Nginx reverse proxy
#  Đứng trước Cloudflare Tunnel (cloudflared → http://nginx:80).
#
#  Sơ đồ:
#    Internet ──Cloudflare Edge──► cloudflared ──► nginx:80
#                                                    ├─ /api/…  → backend:8088
#                                                    ├─ /ws     → backend:8088 (WebSocket)
#                                                    └─ /       → frontend:3000
# =====================================================================================

# ── Upstream ────────────────────────────────────────────────────────────────────
# ⚠️ KHÔNG dùng `server frontend:3000` trong `upstream` vì Nginx chỉ resolve DNS
# một lần lúc khởi động. Khi container `frontend`/`backend` được recreate
# (docker compose up -d) ⇒ IP trong Docker network ĐỔI ⇒ Nginx giữ IP cũ ⇒
# trả về "502 Host is unreachable" cho tới khi restart Nginx.
#
# Giải pháp: dùng `resolver` của Docker (127.0.0.11) + biến để resolve mỗi
# request ⇒ luôn trỏ đúng IP hiện tại của container.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend:8088 resolve;
    keepalive 32;
}

upstream frontend {
    zone frontend 64k;
    server frontend:3000 resolve;
    keepalive 16;
}

# ── Mapping route → upstream ────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare dùng IP thật của client trong CF-Connecting-IP.
# Rate-limit theo IP thật thay vì IP của Cloudflare Edge.
map $http_cf_connecting_ip $real_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

# ── Server chính ────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Cloudflare Tunnel đặt IP thật của client trong CF-Connecting-IP.
    # Rate-limit theo IP thật thay vì IP của Cloudflare Edge.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;

    # ── Security headers ────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # ── Upload lớn (ảnh/video lên tới 100MB) ────────────────────────────────────
    client_max_body_size 105m;

    # ── Logging ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # =============================================================================
    #  BACKEND — API REST
    # =============================================================================
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # Timeout riêng cho upload media.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Tắt buffering để stream response (SSE, progress).
        proxy_buffering off;
    }

    # =============================================================================
    #  BACKEND — WebSocket / STOMP  (endpoint: /ws)
    # =============================================================================
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Bắt buộc cho WebSocket upgrade.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =============================================================================
    #  BACKEND — OAuth2 & actuator
    # =============================================================================
    location /oauth2/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /login/oauth2/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Healthcheck của backend (dùng bởi Docker / monitoring).
    location /actuator/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # =============================================================================
    #  FRONTEND — Next.js
    # =============================================================================
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Next.js static assets — cache lâu.
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # File tĩnh trong /public (ảnh, favicon…).
    location ~* ^/(image|file|globe|next|vercel|window)\.(svg|png|jpg|jpeg|gif|ico|webp)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
}
