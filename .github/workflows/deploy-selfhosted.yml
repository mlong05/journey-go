name: CI/CD Self-Hosted Deploy

# ─────────────────────────────────────────────────────────────────────────────
#  Deploy JourneyGo lên máy chủ cá nhân (self-hosted runner) qua Docker Compose.
#
#  Luồng: push/merge vào `main` → Test (GitHub-hosted, nhanh & cô lập)
#                                    → Deploy (self-hosted runner trên PC)
#
#  Yêu cầu bảo mật:
#   - Job `deploy` CHỈ chạy trên runner có label `self-hosted` + `windows` +
#     `journeygo-deploy`. Label riêng ⇒ workflow chỉ được gán cho runner
#     mà bạn kiểm soát.
#   - Mọi secret nằm trong file `.env` trên máy chủ (được gitignore) ⇒
#     workflow KHÔNG cần chứa secret nào trong GitHub.
#   - Job deploy dùng `environment: production` ⇒ có thể thêm Protection Rule
#     (required reviewers) trong Settings → Environments.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Chỉ chạy test, không deploy"
        required: false
        type: boolean
        default: false

concurrency:
  group: cicd-selfhosted-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  #  1. TEST — chạy trên GitHub-hosted runner (nhanh, không ảnh hưởng máy chủ)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (Backend + Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Backend ──
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Backend — compile & unit test
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean test

      # ── Frontend ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend — check imports
        working-directory: frontend
        run: node scripts/check-imports.cjs src

      - name: Frontend — lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend — build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8088/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder
          NEXT_PUBLIC_GOONG_MAPTILES_KEY: ci-placeholder
          NEXT_PUBLIC_MOCK_PAYMENT: "true"
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  #  2. DEPLOY — self-hosted runner trên PC (Windows)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (Docker Compose, self-hosted)
    needs: test
    if: ${{ !inputs.skip_deploy }}
    runs-on: [self-hosted, windows, journeygo-deploy]
    timeout-minutes: 90
    environment: production

    steps:
      # -- Windows environment bootstrap for the runner ------------------------
      # The runner runs as SYSTEM (Windows Scheduled Task):
      #   * PowerShell 7 (pwsh) is NOT installed -> use Windows PowerShell 5.1.
      #   * ExecutionPolicy for SYSTEM is Restricted -> scripts cannot run.
      #   * Docker Desktop lives in a user profile -> not on SYSTEM's PATH.
      #   * Inline "run:" scripts are written as UTF-8 without BOM, but
      #     PowerShell 5.1 reads .ps1 files as ANSI -> any non-ASCII character
      #     (e.g. Vietnamese text) breaks string literals and causes
      #     ParseError ("The string is missing the terminator").
      # => Every inline script below is intentionally ASCII-only.
      # => Every step runs with -ExecutionPolicy Bypass.
      - name: Prepare Windows environment (Docker PATH + execution policy)
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"

          # 1) Locate the Docker CLI.
          #    Under SYSTEM, $env:LOCALAPPDATA points to the SYSTEM profile,
          #    so scan the real user profiles explicitly.
          $dockerRoots = @(
            "$env:LOCALAPPDATA\Programs\DockerDesktop\resources\bin",
            "C:\Program Files\Docker\Docker\resources\bin",
            "C:\ProgramData\DockerDesktop\resources\bin"
          )
          $dockerRoots += (Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName "AppData\Local\Programs\DockerDesktop\resources\bin" })

          $dockerBin = $dockerRoots | Where-Object { Test-Path (Join-Path $_ "docker.exe") } | Select-Object -First 1
          if (-not $dockerBin) {
            Write-Error "docker.exe not found. Please install Docker Desktop on this machine."
            exit 1
          }
          $env:PATH = "$dockerBin;$env:PATH"
          Write-Host "[OK] Docker CLI: $dockerBin"

          # 2) Copy the Docker Compose CLI plugin into the SYSTEM profile.
          #    Docker Desktop installs it under the user profile's
          #    .docker\cli-plugins folder, which SYSTEM cannot see.
          $pluginSrc = Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName ".docker\cli-plugins" } |
            Where-Object { Test-Path (Join-Path $_ "docker-compose.exe") } |
            Select-Object -First 1
          if ($pluginSrc) {
            $pluginDst = Join-Path $env:USERPROFILE ".docker\cli-plugins"
            New-Item -ItemType Directory -Force -Path $pluginDst | Out-Null
            Copy-Item -Path (Join-Path $pluginSrc "docker-compose.exe") -Destination $pluginDst -Force
            Write-Host "[OK] Docker Compose plugin: $pluginSrc -> $pluginDst"
          } else {
            Write-Host "[WARN] docker-compose plugin not found in any user profile"
          }

          # 3) Export PATH so later steps can resolve "docker".
          #    Use -Encoding ascii so no BOM is written (a BOM would corrupt
          #    the first PATH entry and break command resolution).
          $dockerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding ascii -Append
          Write-Host "[OK] PATH exported to GITHUB_PATH."

      # -- Keep the local .env file on the server ------------------------------
      # The .env file lives OUTSIDE the runner workspace, in a stable folder
      # next to the runner installation (see .runner\.secrets\.env). This is
      # required because "actions/checkout" with "clean: true" wipes the
      # whole workspace directory, so anything stored inside it is lost on
      # every run.
      - name: Back up .env before checkout
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          # Locate the runner installation root by walking up from the
          # workspace until a folder named ".runner" is found.
          # GITHUB_WORKSPACE = <runnerRoot>\.runner\_work\<repo>\<repo>
          $dir = Split-Path -Parent $env:GITHUB_WORKSPACE
          $runnerRoot = $null
          for ($i = 0; $i -lt 8 -and $dir; $i++) {
            if ((Split-Path -Leaf $dir) -eq ".runner") { $runnerRoot = $dir; break }
            $dir = Split-Path -Parent $dir
          }
          if (-not $runnerRoot) {
            Write-Error "Could not locate the .runner folder from GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
            exit 1
          }
          $stableEnv = Join-Path $runnerRoot ".secrets\.env"
          $backupFile = Join-Path $env:RUNNER_TEMP "journeygo-env-backup"
          $flagFile = Join-Path $env:RUNNER_TEMP "journeygo-env-backup.flag"
          Write-Host "[INFO] Runner root  : $runnerRoot"
          Write-Host "[INFO] Stable .env  : $stableEnv"
          if (Test-Path $stableEnv) {
            Copy-Item -Path $stableEnv -Destination $backupFile -Force
            Write-Host "[OK] .env backed up to $backupFile"
            "true" | Out-File -FilePath $flagFile -Encoding ascii
          } else {
            Write-Host "[WARN] No .env found at $stableEnv - using .env.example as template."
            "false" | Out-File -FilePath $flagFile -Encoding ascii
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Keep the local .env file on the server when the runner re-checks out.
          clean: true

      - name: Restore .env after checkout
        if: always()
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $envFile = Join-Path $env:GITHUB_WORKSPACE ".env"
          $backupFile = Join-Path $env:RUNNER_TEMP "journeygo-env-backup"
          $flagFile = Join-Path $env:RUNNER_TEMP "journeygo-env-backup.flag"
          $hasBackup = (Test-Path $flagFile) -and ((Get-Content $flagFile -Raw).Trim() -eq "true")
          if ($hasBackup -and (Test-Path $backupFile)) {
            Copy-Item -Path $backupFile -Destination $envFile -Force
            Write-Host "[OK] .env restored into the workspace."
          } else {
            Write-Host "[WARN] No .env backup found - keeping the current state (if any)."
          }

      - name: Check Docker Engine
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          docker version
          docker compose version

      # The .env file already exists on the server (gitignored, never pushed
      # to GitHub). If it is missing, stop with a clear message instead of
      # deploying with a broken configuration.
      - name: Check .env file (secrets live locally, NOT in GitHub)
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Test-Path .env)) {
            Write-Error "Missing .env on the server. Copy it from .env.example and fill in the secrets. Do NOT commit this file."
            exit 1
          }
          # Print the configured KEYS only (never the VALUES) for auditing.
          Write-Host "Configured variables:"
          Get-Content .env | Where-Object { $_ -match '^[A-Za-z_][A-Za-z0-9_]*=' } |
            ForEach-Object { ($_ -split '=', 2)[0] } | Sort-Object | ForEach-Object { "  - $_" }

      - name: Backup PostgreSQL before deploy
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: .\scripts\backup\backup-postgres.ps1

      - name: Build and deploy (docker compose)
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: .\scripts\deploy\deploy.ps1 -SkipBackup

      - name: Smoke test through internal nginx
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $urls = @("/", "/api/v1/destinations", "/actuator/health/liveness")
          foreach ($u in $urls) {
            $code = curl.exe -s -o NUL -w "%{http_code}" -m 20 "http://127.0.0.1:8080$u"
            Write-Host "$u -> $code"
            if ($code -ne "200") { Write-Error "Smoke test failed at $u"; exit 1 }
          }

      - name: Show container status
        if: always()
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: docker compose ps

      - name: Show backend logs (on deploy failure)
        if: failure()
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: docker compose logs --tail 200 backend
