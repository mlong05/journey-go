name: CI Mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Set up Java (required by the Android Gradle toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      # `.env` là ASSET bắt buộc (khai báo trong pubspec.yaml) ⇒ phải có khi build test.
      # Trong repo không commit `.env` (chứa bí mật) ⇒ tạo từ `.env.example` với giá trị CI.
      - name: Create .env from template
        run: |
          cp .env.example .env
          sed -i 's|^API_BASE_URL=.*|API_BASE_URL=|' .env
          sed -i 's|^GOOGLE_ANDROID_CLIENT_ID=.*|GOOGLE_ANDROID_CLIENT_ID=ci-placeholder|' .env
          sed -i 's|^GOOGLE_WEB_CLIENT_ID=.*|GOOGLE_WEB_CLIENT_ID=ci-placeholder|' .env
          sed -i 's|^GOONG_MAPTILES_KEY=.*|GOONG_MAPTILES_KEY=ci-placeholder|' .env

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter=expanded
