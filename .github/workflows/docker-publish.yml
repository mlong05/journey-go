name: CD Docker Images

# ─────────────────────────────────────────────────────────────────────────────
#  Build & push Docker images (backend + frontend) lên GitHub Container Registry.
#
#  ⚠️ Tự động hoạt động khi tạo TAG (`git push origin v1.0.0`), ngoài ra có thể
#  chạy tay từ tab "Actions" (workflow_dispatch).
#  Sau đó deploy lên server bằng:
#      docker compose pull && docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (mặc định: latest)"
        required: false
        default: "latest"

concurrency:
  group: cd-docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  backend-image:
    name: Backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/journeygo-backend
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
