name: CI Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check named imports resolve to real exports
        run: node scripts/check-imports.cjs src

      - name: Run ESLint
        # `<img>` cố ý (avatar/evidence cần fallback `onError` + URL động) ⇒ chỉ warning, không fail.
        run: npm run lint

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8088/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder
          NEXT_PUBLIC_GOONG_MAPTILES_KEY: ci-placeholder
          NEXT_PUBLIC_MOCK_PAYMENT: "true"
        run: npm run build
