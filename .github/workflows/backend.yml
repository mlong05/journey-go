name: CI Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Maven + JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    # AiProdConfigBindingTest la test @SpringBootTest duy nhat trong bo test: no
    # FULL application context voi @ActiveProfiles("prod"), nen Spring se khoi
    # dong datasource + Flyway + JPA. CI bat buoc can PostgreSQL that.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: journeygo_db
          POSTGRES_USER: journeygo
          POSTGRES_PASSWORD: journeygo
        ports:
          - 5432:5432
        # Cho Postgres san sang truoc khi chay test - Flyway/HikariCP connect
        # ngay khi context khoi dong, khong co thoi gian cho retry lau.
        options: >-
          --health-cmd "pg_isready -U journeygo -d journeygo_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Point the prod profile at the CI service containers instead of the
      # Docker hostnames ("postgres" / "redis") that only exist inside a
      # compose network.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/journeygo_db
      SPRING_DATASOURCE_USERNAME: journeygo
      SPRING_DATASOURCE_PASSWORD: journeygo
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

      # application-prod.yml declares these WITHOUT a default so production
      # fails fast when a secret is missing. CI has no .env file, so the same
      # variables must be supplied here or the Spring context cannot start
      # (jwt.secret is @Value("${jwt.secret}") -> JwtTokenProvider ->
      # JwtAuthenticationFilter -> SecurityConfig all fail to load).
      # These are throwaway CI values - never reused in production.
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      SPRING_MAIL_USERNAME: ci@example.com
      SPRING_MAIL_PASSWORD: ci-password
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      VNPAY_TMN_CODE: DEMOV210
      VNPAY_HASH_SECRET: ci-vnpay-hash-secret
      VNPAY_IPN_URL: http://localhost/api/v1/payments/ipn
      VNPAY_RETURN_URL: http://localhost/api/v1/payments/return
      VNPAY_WEB_RETURN_URL: http://localhost/payments/result

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Verify Maven is available
        run: mvn -B -ntp -v

      - name: Compile sources
        run: mvn -B -ntp clean compile

      - name: Run unit tests
        run: mvn -B -ntp test

      - name: Package application (skip tests)
        run: mvn -B -ntp clean package -DskipTests

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7
