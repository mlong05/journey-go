services:
  # ========================================================
  # 1. Cơ sở dữ liệu PostgreSQL
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: journeygo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: journeygo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d journeygo_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - journeygo-network

  # ========================================================
  # 2. Redis In-Memory Cache (Blacklist, Refresh Token, Rate Limit)
  # ========================================================
  redis:
    image: redis:alpine
    container_name: journeygo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - journeygo-network

  # ========================================================
  # 3. JourneyGo Spring Boot Backend Application
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journeygo-backend
    restart: unless-stopped
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/journeygo_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ""
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      OAUTH2_DEFAULT_REDIRECT_URI: "http://localhost:3000/oauth2/redirect"
    networks:
      - journeygo-network

# ========================================================
# Volumes lưu trữ dữ liệu bền vững
# ========================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ========================================================
# Mạng kết nối nội bộ giữa các container
# ========================================================
networks:
  journeygo-network:
    driver: bridge
