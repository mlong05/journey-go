# =====================================================================================
#  JourneyGo — Self-hosted Deployment (Docker Compose)
#  Máy chủ: Windows PC cá nhân · Truy cập: https://journeygo.id.vn (Cloudflare Tunnel)
#
#  ⚠️ YÊU CẦU: file `.env` ở thư mục gốc (copy từ `.env.example`).
#     Tất cả secret đọc từ đó — KHÔNG hardcode trong file này.
#
#  Lệnh thường dùng:
#     docker compose up -d --build      # build + khởi động toàn bộ
#     docker compose ps                 # xem trạng thái
#     docker compose logs -f backend    # xem log backend
#     docker compose restart backend    # restart 1 service (KHÔNG mất dữ liệu)
#     docker compose down               # dừng (GIỮ volume & dữ liệu)
#     ⚠️ KHÔNG dùng `docker compose down -v` (sẽ XOÁ toàn bộ dữ liệu).
# =====================================================================================

# =====================================================================================
#  Env DÙNG CHUNG cho `backend` và `backend-seed` (YAML anchor).
#
#  ⚠️ Vì sao cần anchor?
#  `application-prod.yml` KHÔNG đặt giá trị mặc định cho các biến "fail-fast":
#  mail, OAuth2 (Google), VNPay, JWT, datasource password…
#  ⇒ Thiếu MỘT biến ⇒ ứng dụng fail lúc khởi động với lỗi kiểu:
#     "Could not resolve placeholder 'SPRING_MAIL_USERNAME' in value "${SPRING_MAIL_USERNAME}""
#
#  Trước đây `backend-seed` khai báo MỘT danh sách env riêng ⇒ dễ sót biến
#  (đã xảy ra: thiếu SPRING_MAIL_* ⇒ container seed không khởi động được).
#  Giờ CẢ HAI service dùng chung khối `<<: *backend-env` ⇒ không còn khả năng lệch.
# =====================================================================================
x-backend-env: &backend-env
  # ── Profile & logging ──────────────────────────────────────────────────────
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
  TZ: Asia/Ho_Chi_Minh
  # ── Database (service name trong Docker network) ───────────────────────────
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-journeygo_db}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-journeygo}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa được đặt trong .env}
  # ── Redis ──────────────────────────────────────────────────────────────────
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  # ── Secret ─────────────────────────────────────────────────────────────────
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chưa được đặt trong .env}
  JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
  JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
  # ── Google OAuth2 ──────────────────────────────────────────────────────────
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # ── Mail (Gmail App Password) ─────────────────────────────────────────────
  SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
  SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
  SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
  SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-JourneyGo Platform}
  MAIL_OTP_EXPIRATION_MINUTES: ${MAIL_OTP_EXPIRATION_MINUTES:-10}
  # ── Cloudinary (upload ảnh/video) ──────────────────────────────────────────
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  # ── CORS / OAuth2 redirect (domain public) ────────────────────────────────
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://journeygo.id.vn}
  OAUTH2_DEFAULT_REDIRECT_URI: ${OAUTH2_DEFAULT_REDIRECT_URI:-https://journeygo.id.vn/oauth2/redirect}
  OAUTH2_AUTHORIZED_REDIRECT_URIS: ${OAUTH2_AUTHORIZED_REDIRECT_URIS:-https://journeygo.id.vn/oauth2/redirect,journeygo://oauth2/redirect,journeygo://auth/callback}
  WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-https://journeygo.id.vn}
  PARTNER_WEB_LOGIN_URL: ${PARTNER_WEB_LOGIN_URL:-https://journeygo.id.vn/login}
  PARTNER_ACTIVATION_URL: ${PARTNER_ACTIVATION_URL:-https://journeygo.id.vn/activate}
  # ── VNPay Sandbox ──────────────────────────────────────────────────────────
  VNPAY_ENABLED: ${VNPAY_ENABLED:-true}
  VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
  VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
  VNPAY_VERSION: ${VNPAY_VERSION:-2.1.0}
  VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  VNPAY_MERCHANT_API_URL: ${VNPAY_MERCHANT_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  VNPAY_IPN_URL: ${VNPAY_IPN_URL:-}
  VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
  VNPAY_WEB_RETURN_URL: ${VNPAY_WEB_RETURN_URL:-}
  VNPAY_APP_REDIRECT_ENABLED: ${VNPAY_APP_REDIRECT_ENABLED:-false}
  VNPAY_APP_SCHEME: ${VNPAY_APP_SCHEME:-journeygo}
  VNPAY_APP_RETURN_URL: ${VNPAY_APP_RETURN_URL:-journeygo://payment/return}
  VNPAY_IP_ADDR: ${VNPAY_IP_ADDR:-127.0.0.1}
  VNPAY_TIMEZONE: ${VNPAY_TIMEZONE:-Asia/Ho_Chi_Minh}
  VNPAY_EXPIRY_MINUTES: ${VNPAY_EXPIRY_MINUTES:-10}
  VNPAY_API_TIMEOUT_MS: ${VNPAY_API_TIMEOUT_MS:-15000}
  VNPAY_VERIFY_SIGNATURE: ${VNPAY_VERIFY_SIGNATURE:-true}
  VNPAY_LOCALE: ${VNPAY_LOCALE:-vn}
  VNPAY_ORDER_TYPE: ${VNPAY_ORDER_TYPE:-other}
  VNPAY_BANK_CODE: ${VNPAY_BANK_CODE:-}
  VNPAY_BANK_LIST_URL: ${VNPAY_BANK_LIST_URL:-https://sandbox.vnpayment.vn/qrpayauth/api/merchant/get_bank_list}
  VNPAY_QR_BANK_TYPE: ${VNPAY_QR_BANK_TYPE:-1}
  VNPAY_DOMESTIC_CARD_BANK_TYPE: ${VNPAY_DOMESTIC_CARD_BANK_TYPE:-2}
  VNPAY_INTERNATIONAL_CARD_BANK_TYPE: ${VNPAY_INTERNATIONAL_CARD_BANK_TYPE:-3}
  # ── AI & Maps ──────────────────────────────────────────────────────────────
  GOONG_API_KEY: ${GOONG_API_KEY:-}
  # ⚠️ Fail-fast: nếu thiếu GEMINI_API_KEY thì `docker compose up` dừng NGAY với
  #    thông báo rõ ràng, thay vì deploy thành công rồi mới phát hiện AI hỏng lúc
  #    người dùng mở chat (lỗi hiện ra rất muộn & khó truy nguyên).
  #    Muốn chạy AI ở chế độ giả lập thì đặt GEMINI_API_KEY=mock trong .env.
  GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY chưa được đặt trong .env — lấy tại https://aistudio.google.com/apikey}
  GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
  GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-1.5-flash}
  # Chống spam AI + bảo vệ quota Gemini (0 = tắt rate limit).
  AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
  AI_MAX_QUESTION_LENGTH: ${AI_MAX_QUESTION_LENGTH:-1000}
  # ── Nghiệp vụ ──────────────────────────────────────────────────────────────
  FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
  REFUND_WINDOW_HOURS: ${REFUND_WINDOW_HOURS:-24}
  DEFAULT_COMMISSION_RATE: ${DEFAULT_COMMISSION_RATE:-0.2000}
  REFUND_RATE_TOURIST_FAULT: ${REFUND_RATE_TOURIST_FAULT:-0.50}
  REFUND_RATE_PLATFORM_FAULT: ${REFUND_RATE_PLATFORM_FAULT:-1.00}
  SETTLEMENT_GRACE_MINUTES: ${SETTLEMENT_GRACE_MINUTES:-0}
  ALLOW_OPEN_PERIOD_SETTLEMENT: ${ALLOW_OPEN_PERIOD_SETTLEMENT:-false}
  BOOKING_EXPIRY_SCAN_INTERVAL_SECONDS: ${BOOKING_EXPIRY_SCAN_INTERVAL_SECONDS:-60}
  BOOKING_INVITATION_APP_URL: ${BOOKING_INVITATION_APP_URL:-journeygo://booking/invitations/accept}
  REFUND_STATUS_CHECK_INTERVAL_SECONDS: ${REFUND_STATUS_CHECK_INTERVAL_SECONDS:-300}
  REFUND_RESUBMIT_WINDOW_HOURS: ${REFUND_RESUBMIT_WINDOW_HOURS:-0}
  JOURNEY_SKIP_LOCATION_CHECK: ${JOURNEY_SKIP_LOCATION_CHECK:-false}
services:
  # ===========================================================================
  #  1. PostgreSQL — cơ sở dữ liệu chính (có pgvector cho AI Virtual Guide)
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: journeygo-postgres
    restart: unless-stopped
    # ⚠️ KHÔNG publish port ra host — chỉ truy cập được trong Docker network.
    #    (Kể cả khi cần debug, dùng: docker compose exec postgres psql -U ...)
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-journeygo_db}
      POSTGRES_USER: ${POSTGRES_USER:-journeygo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa được đặt trong .env}
      # Tăng tốc khởi tạo DB cho máy yếu.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-journeygo} -d ${POSTGRES_DB:-journeygo_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256m
    networks:
      - journeygo-network

  # ===========================================================================
  #  2. Redis — refresh token, token blacklist, rate limiter
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: journeygo-redis
    restart: unless-stopped
    # ⚠️ KHÔNG publish port ra host.
    expose:
      - "6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - journeygo-network

  # ===========================================================================
  #  3. Backend — Spring Boot (profile prod)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journeygo-backend
    restart: unless-stopped
    # Chỉ publish cho Nginx trong cùng network + debug nội bộ qua loopback.
    expose:
      - "8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - journeygo-network

  # ===========================================================================
  #  4. Frontend — Next.js (standalone build)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ⚠️ Next.js INLINE `NEXT_PUBLIC_*` lúc BUILD ⇒ phải truyền qua build args.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://journeygo.id.vn/api/v1}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GOONG_MAPTILES_KEY: ${NEXT_PUBLIC_GOONG_MAPTILES_KEY:-}
        NEXT_PUBLIC_MOCK_PAYMENT: ${NEXT_PUBLIC_MOCK_PAYMENT:-false}
    container_name: journeygo-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - journeygo-network

  # ===========================================================================
  #  5. Nginx — reverse proxy (điểm vào duy nhất từ Cloudflare Tunnel)
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: journeygo-nginx
    restart: unless-stopped
    ports:
      # Bind loopback: chỉ truy cập được từ chính máy này (debug),
      # Cloudflare Tunnel đi qua Docker network nên vẫn hoạt động bình thường.
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - journeygo-network

  # ===========================================================================
  #  6. backend-seed — CHẠY THỦ CÔNG dữ liệu DEMO (không tự chạy khi `up`)
  # ===========================================================================
  #  Dùng chung image với service `backend`. Service này KHÔNG có nhiệm vụ phục vụ web —
  #  nhiệm vụ duy nhất là khởi chạy Java Seed Runner để:
  #    1. chạy Flyway/Hibernate (đảm bảo schema đủ),
  #    2. chạy DataInitializer (dữ liệu nền tảng cố định: Role, TaskType, Region, Theme…),
  #    3. đọc & thực thi các file SQL trong src/main/resources/seed/*.sql theo thứ tự tên file,
  #    4. thoát (exit code 0) sau khi seed xong.
  #
  #  ⚠️ KHÔNG chạy tự động — phải gọi thủ công:
  #     docker compose run --rm backend-seed
  #     docker compose --profile seed run --rm backend-seed     (nếu muốn profile)
  #
  #  Script seed nằm trong image backend (đã COPY src/main/resources/seed).
  # ===========================================================================
  backend-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journeygo-backend-seed
    restart: "no"
    profiles:
      - seed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      # ── BẬT SEED RUNNER ────────────────────────────────────────────────────
      SEED_ENABLED: "true"
      APP_SEED_EXIT_AFTER_RUN: "true"
      # ── Nghiệp vụ (seed) ───────────────────────────────────────────────────
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      DEFAULT_COMMISSION_RATE: ${DEFAULT_COMMISSION_RATE:-0.2000}
    networks:
      - journeygo-network

  # ===========================================================================
  #  7. Cloudflare Tunnel — đưa nginx ra Internet qua https://journeygo.id.vn
  # ===========================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: journeygo-cloudflared
    restart: unless-stopped
    # Tunnel token truyền qua biến môi trường `TUNNEL_TOKEN` (cloudflared tự đọc).
    # ⚠️ Không đặt token trong `command` ⇒ token KHÔNG xuất hiện trong `docker inspect`.
    command: tunnel --no-autoupdate run
    environment:
      TZ: Asia/Ho_Chi_Minh
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN chưa được đặt trong .env}
      # Metrics server — `cloudflared tunnel ready` dùng endpoint `/ready` này.
      TUNNEL_METRICS: 0.0.0.0:20241
    depends_on:
      nginx:
        condition: service_healthy
    # ⚠️ Image gốc `cloudflare/cloudflared` là DISTROLESS — KHÔNG có `sh`,
    # `pgrep`, `wget`, `curl`. Healthcheck dùng `CMD-SHELL`/`pgrep` sẽ luôn
    # fail với exit 127 (no such file).
    #
    # Dùng lệnh có sẵn trong image: `cloudflared tunnel ready` gọi endpoint
    # `/ready` của chính tiến trình (qua TUNNEL_METRICS) và trả exit code 0
    # khi tunnel đã có ít nhất 1 connector healthy tới Cloudflare Edge.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - journeygo-network

# =====================================================================================
#  Volumes — dữ liệu bền vững (KHÔNG bị mất khi container recreate/restart)
# =====================================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

# =====================================================================================
#  Network — chỉ 1 mạng nội bộ, không publish PostgreSQL/Redis ra Internet
# =====================================================================================
networks:
  journeygo-network:
    driver: bridge
    name: journeygo-network
